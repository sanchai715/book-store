version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: book-store-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/bookstore
      - NODE_ENV=production
      - JWT_SECRET=your-secret-key
    depends_on:
      - mongo
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 5

  mongo:
    image: mongo:5.0
    container_name: book-store-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.stats()"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
